# Publishes a release's Linux packages to Jesutobits' apt and dnf repositories
# (packaging/publish-packages.sh). Called by build.yml after a release, or by hand for a tag.
name: Packages

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.3.0
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Update the apt and dnf repositories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c rpm gnupg
      - name: Import the signing key
        env:
          KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: printf '%s\n' "$KEY" | gpg --batch --import
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash packaging/publish-packages.sh "${{ inputs.tag }}"
