# Builds Jesutobits for Windows x64: the Jesutobits extension from the jesutobits repository,
# built in, and VS Code at upstream.json's tag, patched and rebranded (scripts/prepare.mjs),
# packaged with its per-user installer (scripts/build.mjs).
name: Build

on:
  workflow_dispatch:
    inputs:
      jesutobits_ref:
        description: Branch, tag or commit of divinefavourak/jesutobits to build in
        default: pivot/code-oss
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # The Jesutobits extension: runtime, agent panel, preview launcher (ADR-0015).
      - uses: actions/checkout@v7
        with:
          repository: divinefavourak/jesutobits
          ref: ${{ inputs.jesutobits_ref || 'pivot/code-oss' }}
          path: jesutobits
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: jesutobits/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: jesutobits/.nvmrc
      - name: Build the Jesutobits extension
        working-directory: jesutobits
        run: |
          pnpm install --frozen-lockfile
          pnpm build:packages
          pnpm build:extension

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare the source
        run: node scripts/prepare.mjs --extension jesutobits/apps/vscode-extension

      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Build
        run: node scripts/build.mjs
        env:
          # Electron and other GitHub release downloads are rate-limited without a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: jesutobits-win32-x64-user-setup
          path: vscode/.build/win32-x64/user-setup/*.exe
          retention-days: 14
