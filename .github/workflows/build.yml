# Builds Jesutobits for Windows x64, Linux x64 and macOS (Apple Silicon and Intel): the
# Jesutobits extension from the jesutobits repository, built in, and VS Code at
# upstream.json's tag, patched and rebranded (scripts/prepare.mjs), packaged per platform
# (scripts/build.mjs). Mac apps are signed ad hoc only: there is no Apple Developer ID yet.
name: Build

on:
  workflow_dispatch:
    inputs:
      jesutobits_ref:
        description: Branch, tag or commit of divinefavourak/jesutobits to build in
        default: pivot/code-oss
  push:
    branches: [main]
    paths-ignore: ["**.md"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, target: win32-x64 }
          - { name: Linux x64, os: ubuntu-latest, target: linux-x64 }
          - { name: macOS Apple Silicon, os: macos-latest, target: darwin-arm64 }
          - { name: macOS Intel, os: macos-15-intel, target: darwin-x64 }
    steps:
      - uses: actions/checkout@v7

      # The Jesutobits extension: runtime, agent panel, preview launcher (ADR-0015).
      - uses: actions/checkout@v7
        with:
          repository: divinefavourak/jesutobits
          ref: ${{ inputs.jesutobits_ref || 'pivot/code-oss' }}
          path: jesutobits
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: jesutobits/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: jesutobits/.nvmrc
      - name: Build the Jesutobits extension
        working-directory: jesutobits
        run: |
          pnpm install --frozen-lockfile
          pnpm build:packages
          pnpm build:extension

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # What VS Code's own Linux pipeline installs (build/azure-pipelines/linux).
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 rpm fakeroot dpkg

      - name: Prepare the source
        run: node scripts/prepare.mjs --extension jesutobits/apps/vscode-extension

      - uses: actions/setup-node@v7
        with:
          node-version-file: vscode/.nvmrc
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Build
        run: node scripts/build.mjs --target ${{ matrix.target }}
        env:
          # Electron, the Linux sysroot and other GitHub release downloads are rate-limited
          # without a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: jesutobits-${{ matrix.target }}
          path: dist/*
          retention-days: 14
